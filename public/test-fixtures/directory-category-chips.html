<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DirectoryCategoryChips Fixture</title>
    <style>
      :root {
        --bg: #010309;
        --fg: #f5efe0;
        --muted: #a89a78;
        --border: rgba(212, 175, 55, 0.35);
        --primary: #d4af37;
        --primary-fg: #010309;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }
      .wrap { padding: 16px; width: 100%; max-width: 100%; overflow: hidden; }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .chip {
        width: 100%;
        min-width: 0;
        height: 48px;
        border-radius: 12px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        border: 2px solid var(--border);
        background: rgba(255,255,255,0.03);
        color: var(--fg);
        font: 600 14px/1.2 system-ui, sans-serif;
        cursor: pointer;
      }
      .chip.active {
        background: var(--primary);
        color: var(--primary-fg);
        border-color: var(--primary);
      }
      .chip .label-group {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        overflow: hidden;
      }
      .chip .label {
        text-align: left;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chip .count {
        flex-shrink: 0;
        border-radius: 999px;
        padding: 2px 8px;
        font: 700 12px/1 ui-monospace, monospace;
        background: rgba(255,255,255,0.08);
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .chip.active .count {
        background: rgba(1,3,9,0.2);
        color: var(--primary-fg);
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="root">
      <div class="grid" data-testid="chips-grid">
        <button class="chip active" data-testid="chip-all">
          <span class="label-group">
            <span class="label">All</span>
          </span>
          <span class="count" data-testid="count-all">24</span>
        </button>
        <button class="chip" data-testid="chip-metro">
          <span class="label-group">
            <span class="label">Metro Manila</span>
          </span>
          <span class="count" data-testid="count-metro">12</span>
        </button>
        <button class="chip" data-testid="chip-luzon">
          <span class="label-group">
            <span class="label">Luzon</span>
          </span>
          <span class="count" data-testid="count-luzon">8</span>
        </button>
        <button class="chip" data-testid="chip-visayas">
          <span class="label-group">
            <span class="label">Visayas &amp; Mindanao</span>
          </span>
          <span class="count" data-testid="count-visayas">4</span>
        </button>
      </div>
    </div>
  </body>
</html>
